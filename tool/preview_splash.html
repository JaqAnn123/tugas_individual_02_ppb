<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nottia - splash preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #17171d;
      font-family: system-ui, sans-serif;
      padding: 32px 24px 72px;
    }
    .stage {
      position: relative;
      width: 393px;
      height: 852px;
    }
    .phone {
      width: 393px;
      height: 852px;
      overflow: hidden;
      border-radius: 44px;
      background: #040414;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.65), 0 0 0 10px #0b0b10, 0 0 0 11px #2a2a35;
    }
    .phone iframe {
      display: block;
      width: 393px;
      height: 852px;
      border: 0;
    }
    .meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -30px;
      color: #6b6b7d;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <iframe src="./index.html" title="Nottia splash preview"></iframe>
    </div>
    <div class="meta">Nottia &middot; splash &middot; 393 &times; 852</div>
  </div>
</body>
</html>
